# split panes using | and -
bind | split-window -h
bind - split-window -v
unbind '"'
unbind %

# reload
bind r source-file ~/.tmux.conf

bind h select-pane -L
bind l select-pane -R
bind k select-pane -U
bind j select-pane -D

bind-key e resize-pane -L 25
bind-key r resize-pane -R 25

# tmux-surfer. f picks a project and switches to its session; g picks any
# window in any session. Both are popups: the picker gets a box over the current
# pane, and display-popup is run by the client itself, unlike the run-shell +
# neww this used to be, which costs two extra processes before the picker can
# appear. A new window would also show up in g's own list of windows.
bind-key -r f display-popup -E -T ' tmux-surfer: projects ' -w 80% -h 60% "~/bin/tmux-surfer"
bind-key -r g display-popup -E -T ' tmux-surfer: windows ' -w 80% -h 60% "~/bin/tmux-surfer --windows"

set-option -g allow-rename off

# Look and Feel
# DESIGN TWEAKS
run ~/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux

# don't do anything when a 'bell' rings
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
setw -g monitor-activity off
set -g bell-action none

# clock mode
setw -g clock-mode-colour yellow

# copy mode
setw -g mode-style 'fg=black bg=green bold'
setw -g copy-mode-position-style 'fg=black bg=#b27ab8 bold'

# panes
set -g pane-border-style 'fg=red'
set -g pane-active-border-style 'fg=yellow'

# popups (tmux-surfer's pickers). The border is a quiet light grey -- light
# enough to read the title that shares its colour, and short of the white used
# for the current window name in the status bar. It was green, then too dark to
# see at 236.
set -g popup-border-lines rounded
set -g popup-border-style 'fg=colour250'

# statusbar
set -g status-position bottom
set -g status-justify left
set -g status-style 'fg=green'

set -g status-left ''
set -g status-left-length 10

set -g status-right-style 'fg=black bg=green'
set -g status-right '%Y-%m-%d %H:%M '
set -g status-right-length 50

setw -g window-status-current-style 'fg=black bg=green'
setw -g window-status-current-format ' #I #W #F '

setw -g window-status-style 'fg=green bg=black'
setw -g window-status-format ' #I #[fg=white]#W #[fg=green]#F '

setw -g window-status-bell-style 'fg=yellow bg=red bold'

# messages
# message-command-style is the `,` rename prompt / `:` command prompt
# (message-format picks it when command_prompt is set); message-style is
# plain display-message output. fill=black keeps the rest of the line on
# the bar (#13161a = fade's ANSI black).
set -g message-style 'fg=black bg=green fill=black bold'
set -g message-command-style 'fg=black bg=green fill=black bold'

set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*-256color*:Tc"

set -g extended-keys on
set -g extended-keys-format csi-u
